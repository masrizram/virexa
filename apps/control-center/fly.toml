# Virexa Control Center on Fly.io
app = "virexa-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_API_BASE_URL = "https://virexa-api.fly.dev"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[checks]]
  name = "web-liveness"
  type = "http"
  port = 3000
  path = "/api/ping"
  interval = "15s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "rolling"
