# Virexa Content OS API on Fly.io
app = "virexa-api"
primary_region = "sin"

[build]

[env]
  ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[checks]]
  name = "api-liveness"
  type = "http"
  port = 8000
  path = "/healthz"
  interval = "15s"
  timeout = "5s"

[[checks]]
  name = "api-readiness"
  type = "http"
  port = 8000
  path = "/ready"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "rolling"
  # Migrations run via release command using DIRECT Neon URL:
  #   fly secrets set APP_DATABASE_DIRECT_URL=... (already a secret)
  release_command = "bash -c 'pip install --no-cache-dir alembic >/dev/null 2>&1; alembic upgrade head' || true"
