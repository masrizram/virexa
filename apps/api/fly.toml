# fly.toml app configuration file generated for virexa-api on 2026-08-24T19:16:06+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'virexa-api'
primary_region = 'sin'

[build]
[deploy]
  strategy = 'rolling'
  release_command = "alembic upgrade head"

[env]
  ENV = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[checks]
  [checks.api-liveness]
    port = 8000
    type = 'http'
    interval = '15s'
    timeout = '5s'
    path = '/healthz'

  [checks.api-readiness]
    port = 8000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    path = '/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
