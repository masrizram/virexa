name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virexa
          POSTGRES_PASSWORD: virexa_dev
          POSTGRES_DB: content_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U virexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv sync
      - run: uv run pytest -q
        env:
          APP_DATABASE_URL: postgresql+psycopg://virexa:virexa_dev@localhost:5432/content_os

  deploy-api:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy apps/api --strategy rolling --wait-timeout 900
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VIREXA_API }}

  deploy-windmill-server:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --config services/windmill/fly.server.toml --strategy rolling --wait-timeout 900
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VIREXA_WINDMILL }}

  deploy-windmill-worker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --config services/windmill/fly.worker.toml --strategy rolling --wait-timeout 900
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VIREXA_WINDMILL_WORKER }}

  deploy-video:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy services/moneyprinterturbo --strategy rolling --wait-timeout 900
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VIREXA_VIDEO }}

  deploy-web:
    needs: [ci, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy apps/control-center --strategy rolling --wait-timeout 900
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VIREXA_WEB }}

  verify:
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy smoke
        run: |
          check() {  # retry up to 6x/60s — rolling deploys restart machines async
            for i in 1 2 3 4 5 6; do
              if curl -sf -m 30 "$1" -o /dev/null; then echo "OK $1 (try $i)"; return 0; fi
              sleep 10
            done
            echo "FAIL $1"; return 1
          }
          sleep 20
          check https://virexa-api.fly.dev/healthz
          check https://virexa-web.fly.dev/
          check https://virexa-windmill.fly.dev/
