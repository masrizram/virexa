name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virexa
          POSTGRES_PASSWORD: virexa_dev
          POSTGRES_DB: content_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U virexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check app
      - run: uv run alembic upgrade head
        env:
          APP_DATABASE_DIRECT_URL: postgresql+psycopg://virexa:virexa_dev@localhost:5432/content_os
      - run: uv run alembic check
        env:
          APP_DATABASE_DIRECT_URL: postgresql+psycopg://virexa:virexa_dev@localhost:5432/content_os
      - run: uv run pytest
        env:
          APP_DATABASE_TEST_URL: postgresql+psycopg://virexa:virexa_dev@localhost:5432/content_os

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
